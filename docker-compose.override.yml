# Видеокарта NVIDIA для pyannote. docker compose подхватывает этот файл сам.
# Нужны драйвер NVIDIA и Docker Desktop на WSL2 (Windows) или nvidia-container-toolkit (Linux).
# Нет видеокарты или ошибка "could not select device driver": удалите или переименуйте этот файл,
# pyannote будет работать на cpu.
services:
  web:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  prepare:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
