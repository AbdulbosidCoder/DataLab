services:
  web:                      # веб-интерфейс: http://localhost:8000
    build: .
    image: datalab
    env_file: .env          # XONSAROY_API_KEY=xs_stt_... (или STT_PROVIDER=voicelab + VOICELAB_API_KEY)
    volumes:
      - ./data:/data        # загруженные видео, аудио, сегменты, расшифровки и БД
    ports:
      - "8000:8000"
    restart: unless-stopped

  prepare:                  # пакетная обработка data/videos без браузера
    build: .
    image: datalab
    profiles: ["cli"]
    env_file: .env
    volumes:
      - ./data:/data
    entrypoint: ["python", "-m", "pipeline.prepare", "--videos", "/data/videos", "--out", "/data"]
